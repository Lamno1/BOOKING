<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1270" viewBox="0 0 800 1270"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#cfdbad" stroke-width="1.4"/></marker><marker id="diamond" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1,6 L7,1 L13,6 L7,11 Z" fill="#cfdbad"/></marker></defs><rect width="100%" height="100%" fill="#1d2822"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="29" fill="#e9eee4" text-anchor="start">STAYOS · Workflow AI thực hiện</text><text x="40" y="80" font-size="17" fill="#b5c3ae" text-anchor="start">Lượt hiện tại: tạo bộ xem trước, chưa sửa booking chính.</text><rect x="70" y="115" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="151" font-size="25" fill="#e9eee4" text-anchor="start">01</text><text x="150" y="151" font-size="22" fill="#e9eee4" text-anchor="start">Đọc yêu cầu &amp; hiện trạng</text><text x="150" y="185" font-size="16" fill="#e9eee4" text-anchor="start">Tách dữ liệu thật, concept và phần còn thiếu</text><path d="M400,215 V250" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="250" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="286" font-size="25" fill="#e9eee4" text-anchor="start">02</text><text x="150" y="286" font-size="22" fill="#e9eee4" text-anchor="start">Tạo ảnh sản phẩm đích</text><text x="150" y="320" font-size="16" fill="#e9eee4" text-anchor="start">Desktop + mobile theo hướng B</text><path d="M400,350 V385" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="385" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="421" font-size="25" fill="#e9eee4" text-anchor="start">03</text><text x="150" y="421" font-size="22" fill="#e9eee4" text-anchor="start">Vẽ UML &amp; workflow</text><text x="150" y="455" font-size="16" fill="#e9eee4" text-anchor="start">Chốt cấu trúc dữ liệu, luồng lỗi và tiêu chí</text><path d="M400,485 V520" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="520" width="660" height="100" rx="8" fill="#cfdbad" stroke="#9eaf99"/><text x="92" y="556" font-size="25" fill="#1d2822" text-anchor="start">04</text><text x="150" y="556" font-size="22" fill="#1d2822" text-anchor="start">Chủ dự án duyệt bộ xem trước</text><text x="150" y="590" font-size="16" fill="#1d2822" text-anchor="start">Sửa ảnh/sơ đồ nếu chưa phù hợp</text><path d="M400,620 V655" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="655" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="691" font-size="25" fill="#e9eee4" text-anchor="start">05</text><text x="150" y="691" font-size="22" fill="#e9eee4" text-anchor="start">Làm bản tương tác trong review</text><text x="150" y="725" font-size="16" fill="#e9eee4" text-anchor="start">Gallery, gói, dịch vụ, lịch và trạng thái</text><path d="M400,755 V790" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="790" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="826" font-size="25" fill="#e9eee4" text-anchor="start">06</text><text x="150" y="826" font-size="22" fill="#e9eee4" text-anchor="start">Kiểm thử &amp; so với bản duyệt</text><text x="150" y="860" font-size="16" fill="#e9eee4" text-anchor="start">UI, giá/quyền lợi, mobile và hiệu năng</text><path d="M400,890 V925" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="925" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="961" font-size="25" fill="#e9eee4" text-anchor="start">07</text><text x="150" y="961" font-size="22" fill="#e9eee4" text-anchor="start">Tích hợp API &amp; bảo toàn đơn cũ</text><text x="150" y="995" font-size="16" fill="#e9eee4" text-anchor="start">Chỉ dùng giá, chính sách và quyền lợi đã duyệt</text><path d="M400,1025 V1060" fill="none" stroke="#cfdbad" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="1060" width="660" height="100" rx="8" fill="#29372e" stroke="#9eaf99"/><text x="92" y="1096" font-size="25" fill="#e9eee4" text-anchor="start">08</text><text x="150" y="1096" font-size="22" fill="#e9eee4" text-anchor="start">Bàn giao bằng chứng để nghiệm thu</text><text x="150" y="1130" font-size="16" fill="#e9eee4" text-anchor="start">Bản chạy, ảnh so sánh, kiểm thử và giới hạn</text><text x="400" y="1235" font-size="16" fill="#b5c3ae" text-anchor="middle">Không duyệt ảnh AI thành ảnh thật; không suy ra quyền lợi kinh doanh.</text></g></svg>